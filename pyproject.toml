[project]
name = "sql-library-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AliLivesHere", email = "alirezakamru@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg2-binary>=2.9.13",
